name: pmpml_journey_guide2

description: PMPML Voice Assisted Journey Guide for Pune buses
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Text-to-Speech for voice announcements
  flutter_tts: ^3.6.3
  speech_to_text: ^7.0.0

  # Haptic feedback / vibration for arrival alerts
  vibration: ^3.1.3

  # Permission handler for microphone access
  permission_handler: ^11.4.0

  # For location tracking
  geolocator: ^12.0.0
  url_launcher: ^6.2.5
  # For maps and routes
  google_maps_flutter: ^2.6.1

  # Icons
  cupertino_icons: ^1.0.6
  flutter_background_service: ^5.0.5
  flutter_background_service_android: ^6.2.2
  wakelock_plus: ^1.2.8
  flutter_local_notifications: ^17.0.0
  sqflite: ^2.3.2
  path: ^1.9.0




  # HTTP for Google Maps Directions API
  http: ^1.2.1

  # Offline speech recognition (Vosk)
  vosk_flutter:
    git:
      url: https://github.com/alphacep/vosk-flutter.git
      ref: master

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Assets must be listed here, not under dependencies
  assets:
    - assets/vosk-model-small-en-us-0.15/
    - assets/pmpml.db